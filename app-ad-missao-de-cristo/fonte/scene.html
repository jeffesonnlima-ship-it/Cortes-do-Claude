<style>
:root{--navy:#0E1F4D;--deep:#071233;--ink:#050C24;--tile:#22315C;--gold:#D3AF59;--gold2:#EBD08F;--page:#F2F5FA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;overflow:hidden;background:var(--ink);font-family:'Inter',sans-serif;color:#fff}
#root{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,#1A2E68 0%,#0E1F4D 38%,#071233 70%,#050C24 100%)}
.ring{position:absolute;border-radius:50%;border:1.5px solid rgba(211,175,89,.22)}
#parts{position:absolute;inset:0}
/* headline */
#head{position:absolute;left:0;right:0;top:64px;height:170px;text-align:center}
.hl{position:absolute;left:24px;right:24px;top:0}
.hl .lb{font-size:14px;font-weight:800;letter-spacing:4px;color:var(--gold);text-transform:uppercase;display:inline-flex;align-items:center;gap:10px}
.hl .lb:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.hl .tt{font-family:'Inter Display','Inter';font-weight:800;font-size:42px;letter-spacing:-1.2px;line-height:1.05;margin-top:10px}
.hl .tt em{font-style:normal;color:var(--gold2)}
/* phone */
#phoneWrap{position:absolute;left:0;top:0;width:540px;height:960px}
#phone{position:absolute;left:0;top:0;width:320px;height:665px;transform-origin:0 0;border-radius:48px;background:linear-gradient(145deg,#2a2f3d,#0b0d14);
  box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 2px #3a4152,inset 0 0 0 2px #000}
#screen{position:absolute;left:10px;top:10px;width:300px;height:645px;border-radius:38px;overflow:hidden;background:var(--page)}
#sbar{position:absolute;left:0;top:0;width:300px;height:22px;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0;font-size:11px;font-weight:700;color:#111;z-index:3}
#notch{position:absolute;left:115px;top:6px;width:70px;height:18px;border-radius:10px;background:#000;z-index:4}
.shot{position:absolute;left:0;top:22px;width:300px;height:623px}
#spot{position:absolute;border-radius:16px;border:3px solid #D3AF59;box-shadow:0 0 26px 6px rgba(211,175,89,.55);pointer-events:none;z-index:5}
#mask{position:absolute;left:0;top:0;z-index:4;pointer-events:none}
#tap{position:absolute;width:16px;height:16px;margin:-8px;border-radius:50%;background:rgba(211,175,89,.75);z-index:6}
#glare{position:absolute;inset:0;border-radius:38px;background:linear-gradient(115deg,rgba(255,255,255,.18) 0%,transparent 30%);pointer-events:none;z-index:7}
/* badges */
.badge{position:absolute;white-space:nowrap;border-radius:999px;padding:10px 18px;font-weight:800;font-size:16px;letter-spacing:.5px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.bg-gold{background:var(--gold);color:var(--ink)}.bg-navy{background:var(--navy);color:#fff;border:1.5px solid rgba(211,175,89,.6)}
.card{position:absolute;border-radius:22px;background:rgba(14,31,77,.92);border:1.5px solid rgba(211,175,89,.45);box-shadow:0 24px 60px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
#flash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,240,205,.9),rgba(211,175,89,.25) 45%,transparent 75%);opacity:0;pointer-events:none}
.vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 50%,rgba(2,6,20,.7) 100%);pointer-events:none}
</style></head>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,b)=>cl((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eo=x=>1-Math.pow(1-x,3), eo5=x=>1-Math.pow(1-x,5), ei=x=>x*x*x;
const bk=x=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const lerp=(a,b,x)=>a+(b-a)*x;
function W(pref,after=0){const w=WD.find(w=>w[0]>=after&&w[2].toLowerCase().replace(/[^a-z0-9à-ú]/g,'').startsWith(pref));return w?w[0]:after;}
const T={paz:W('paz'),igreja:W('igreja'),app:W('aplicativo'),cara:W('cara'),mesmas:W('mesmas'),novid:W('novidades'),tela:W('tela'),biblia:W('bíblia'),pedido:W('pedido'),dizimos:W('dízimos'),pix:W('pix'),breve:W('breve'),cultos:W('cultos',15),youtube:W('youtube'),painel:W('painel'),prog:W('programação'),semana:W('semana'),devoc:W('devocional'),palavra:W('palavra',23),quiz:W('quiz'),n30:W('30'),pergunta:W('pergunta'),comun:W('comunidade'),wpp:W('whatsapp'),acomp:W('acompanha'),atualize:W('atualize'),aplic2:W('aplicativo',34),deus:W('deus'),END:39.0};
// screen coords from original screenshot coords
const K=300/720; const sx=x=>x*K, sy=y=>(y-62)*K+22;
const box=(x0,y0,x1,y1)=>({x:sx(x0)+10,y:sy(y0)+10,w:(x1-x0)*K,h:(y1-y0)*K}); // phone-local
const center=b=>[b.x+b.w/2,b.y+b.h/2];
const B={card:box(36,446,684,938),oracao:box(44,976,176,1180),diz:box(211,976,343,1180),culto:box(378,976,510,1180),biblia:box(545,976,677,1180),row:box(36,976,684,1180),
  chips:box(36,385,605,648),empty:box(36,690,684,868),streak:box(36,386,684,548),days:box(36,590,684,718),devcard:box(36,760,684,1400),
  pts:box(543,297,684,378),quizcard:box(36,420,684,780),wpp:box(76,521,644,617),famcard:box(36,342,684,657),list:box(36,700,684,1400)};
const TAB=[85,222,360,498,635];
// ---------- headlines ----------
const HL=[[T.cara-0.15,'AD Missão de Cristo','App de <em>cara nova</em>'],[T.tela-0.1,'Tela inicial','Tudo na <em>palma da mão</em>'],
 [T.biblia-0.1,'Novidade','<em>Bíblia</em> online'],[T.pedido-0.1,'Tela inicial','Pedido de <em>oração</em>'],[T.dizimos-0.1,'Tela inicial','Dízimos e ofertas <em>via PIX</em>'],
 [T.breve-0.1,'Em breve','Cultos <em>ao vivo</em>'],[T.painel-0.1,'Eventos','Programação <em>toda semana</em>'],[T.devoc-0.1,'Devocional','Uma palavra <em>para cada dia</em>'],
 [T.quiz-0.1,'Quiz Bíblico','<em>30 segundos</em> por pergunta'],[T.comun-0.1,'Comunidade','Faça parte <em>da família</em>']];
HL.forEach((h,i)=>{const d=document.createElement('div');d.className='hl';d.id='hl'+i;d.innerHTML=`<div class="lb">${h[1]}</div><div class="tt">${h[2]}</div>`;$('head').appendChild(d);});
// ---------- camera keyframes: [time reached, dur, scale, focusX, focusY, rotY, rotX] ----------
const PC=[160,332];
const CAM=[
 [0,0,0.9,...PC,28,6],
 [T.cara+0.4,1.6,0.95,...PC,-10,2],
 [T.tela,0.8,1.0,...PC,0,0],
 [T.biblia+0.15,0.6,1.75,...center(B.biblia),0,0],
 [T.pedido+0.15,0.5,1.75,...center(B.oracao),0,0],
 [T.dizimos+0.15,0.5,1.75,...center(B.diz),0,0],
 [T.breve+0.15,0.5,1.75,...center(B.culto),0,0],
 [T.painel-0.35,0.7,1.0,...PC,0,0],
 [T.prog+0.2,0.6,1.08,160,300,-6,0],
 [T.devoc-0.2,0.5,1.0,...PC,0,0],
 [T.devoc+0.45,0.5,1.45,...center(B.streak),0,0],
 [T.palavra+0.1,0.6,1.3,160,center(B.devcard)[1]-60,0,0],
 [T.quiz-0.15,0.5,1.0,...PC,0,0],
 [T.quiz+0.5,0.5,1.35,...center(B.quizcard),0,0],
 [T.n30+0.1,0.5,1.05,140,332,-10,0],
 [T.comun-0.15,0.5,1.0,...PC,0,0],
 [T.wpp+0.1,0.6,1.5,...center(B.wpp),0,0],
 [T.acomp+0.2,0.6,1.1,160,380,6,0],
 [T.atualize+0.2,0.7,0.7,...PC,-18,8]];
const C=[270,582];
function cam(t){let st=CAM[0].slice(2);
  for(let i=1;i<CAM.length;i++){const k=CAM[i];const a=k[0]-k[1];if(t<=a)break;const q=eio(p(t,a,k[0]));const nx=k.slice(2);st=st.map((v,j)=>lerp(v,nx[j],q));}
  return st;}
// ---------- spotlights [t0,t1,box] ----------
const SP=[[T.biblia-0.05,T.pedido-0.15,B.biblia],[T.pedido-0.05,T.dizimos-0.15,B.oracao],[T.dizimos-0.05,T.breve-0.2,B.diz],[T.breve-0.05,T.painel-0.5,B.culto],
 [T.prog-0.05,T.devoc-0.4,B.chips],[T.devoc+0.4,T.palavra-0.1,B.streak],[T.palavra,T.quiz-0.4,B.devcard],[T.quiz+0.45,T.n30,B.quizcard],[T.wpp-0.05,T.acomp+0.1,B.wpp],[T.acomp+0.2,T.atualize-0.3,B.list]];
// ---------- screens: [switchTime, index] with tab taps ----------
const SCR=[[0,1],[T.painel-0.3,2],[T.devoc-0.3,3],[T.quiz-0.3,4],[T.comun-0.3,5]];
// build days
['S','T','Q','Q','S','S','D'].forEach(d=>{const e=document.createElement('div');e.style.cssText='flex:1;height:30px;border-radius:9px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#AEB9D6';e.textContent=d;$('cDays').appendChild(e);});
// rings
[[270,330,260],[270,330,380],[60,820,220],[500,120,180]].forEach(([x,y,r],i)=>{const e=document.createElement('div');e.className='ring';e.style.cssText+=`left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px`;e.dataset.i=i;$('rings').appendChild(e);});
for(let i=0;i<40;i++){const e=document.createElement('div');e.className='abs';const s=2+((i*13)%4);e.style.cssText=`width:${s}px;height:${s}px;border-radius:50%;background:#EBD08F;box-shadow:0 0 ${s*3}px #D3AF59`;e.dataset.x=(i*97)%540;e.dataset.sp=14+((i*31)%30);e.dataset.ph=(i*.37)%1;$('parts').appendChild(e);}
$('tRing').style.strokeDasharray=2*Math.PI*70;

function badge(id,t,t0,t1,x,y,rot=0){const e=$(id);const q=bk(p(t,t0,t0+0.35)),o=p(t,t1-0.2,t1);
  e.style.display=(t>t0&&t<t1)?'flex':'none';e.style.left=x+'px';e.style.top=y+'px';
  e.style.transform=`scale(${Math.max(0,q)*(1-o*0.3)}) rotate(${rot}deg)`;e.style.opacity=1-o;}

function render(t){
  // background
  $('rings').querySelectorAll('.ring').forEach(r=>{const i=+r.dataset.i;r.style.transform=`scale(${1+0.05*Math.sin(t*0.6+i)}) translate(${Math.sin(t*0.3+i)*10}px,${Math.cos(t*0.25+i)*8}px)`;});
  $('parts').querySelectorAll('div').forEach(e=>{const y=960-((t*(+e.dataset.sp)+(+e.dataset.ph)*1000)%1000);e.style.left=(+e.dataset.x+Math.sin(t+(+e.dataset.ph)*9)*12)+'px';e.style.top=y+'px';e.style.opacity=0.25+0.3*Math.sin(t*2+(+e.dataset.ph)*20);});
  // intro
  const io=p(t,T.app-0.5,T.app+0.1);
  $('intro').style.display=t<T.app+0.2?'block':'none';
  const lq=bk(p(t,0.05,0.65));$('iLogoW').style.transform=`translateY(${-ei(io)*240}px) scale(${Math.max(0,lq)*lerp(1,0.4,eo(io))})`;$('iLogoW').style.opacity=1-io;
  $('iHalo').style.opacity=0.7+0.3*Math.sin(t*4);
  const pq=p(t,T.paz-0.1,T.paz+0.3);$('iPaz').firstElementChild.style.opacity=pq;$('iPaz').firstElementChild.style.letterSpacing=lerp(12,5,eo(pq))+'px';
  const gq=p(t,T.igreja-0.08,T.igreja+0.18);const ig=$('iPaz').lastElementChild;ig.style.opacity=gq;ig.style.transform=`scale(${lerp(1.6,1,eo5(gq))})`;ig.style.filter=`blur(${(1-gq)*8}px)`;
  $('iPaz').style.opacity=1-io;$('iPaz').style.transform=`translateY(${io*60}px)`;
  // headlines
  HL.forEach((h,i)=>{const e=$('hl'+i);const t0=h[0],t1=i<HL.length-1?HL[i+1][0]:T.atualize-0.2;
    const q=p(t,t0,t0+0.35),o=p(t,t1-0.05,t1+0.2);const vis=t>=t0&&t<t1+0.2;e.style.display=vis?'block':'none';
    if(vis){e.style.opacity=q*(1-o);e.style.transform=`translateY(${(1-eo(q))*24-o*18}px)`;e.style.filter=`blur(${(1-q)*6+o*6}px)`;}});
  // phone
  const ph=$('phone');
